<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>License Key Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #fff;
        }

        /* Glassmorphism Card Container */
        .glass-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            width: 400px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
        }

        h2 {
            margin-bottom: 25px;
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        /* Glass Input Box */
        .glass-input-box {
            position: relative;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.2);
            outline: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            text-align: center;
            letter-spacing: 2px;
            backdrop-filter: blur(5px);
            transition: 0.3s ease;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: normal;
        }

        input:focus {
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        /* Glass Buttons */
        .glass-btn {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            border-radius: 12px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }

        .glass-btn:active {
            transform: translateY(0);
        }

        .copy-btn {
            background: rgba(46, 204, 113, 0.2);
            border-color: rgba(46, 204, 113, 0.4);
        }

        .copy-btn:hover {
            background: rgba(46, 204, 113, 0.3);
            border-color: rgba(46, 204, 113, 0.6);
        }

        #status {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 10px;
            min-height: 18px;
        }
    </style>
</head>
<body>

    <div class="glass-container">
        <h2>License Generator</h2>
        
        <div class="glass-input-box">
            <input type="text" id="keyField" placeholder="Click generate key" readonly>
        </div>

        <button class="glass-btn" onclick="generateKey()">Generate Key</button>
        <button class="glass-btn copy-btn" onclick="copyKey()">Copy Key</button>
        
        <div id="status"></div>
    </div>

    <script>
        function generateKey() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            let key = "DRAGON-";
            for (let i = 0; i < 16; i++) {
                key += chars.charAt(Math.floor(Math.random() * chars.length));
                if((i + 1) % 4 === 0 && i < 15) key += "-";
            }
            document.getElementById("keyField").value = key;
            document.getElementById("status").innerText = "New key generated successfully!";
            setTimeout(() => { document.getElementById("status").innerText = ""; }, 3000);
        }

        function copyKey() {
            const keyField = document.getElementById("keyField");
            if(keyField.value === "") {
                document.getElementById("status").innerText = "Please generate a key first!";
                return;
            }
            keyField.select();
            navigator.clipboard.writeText(keyField.value);
            document.getElementById("status").innerText = "Key copied to clipboard!";
            setTimeout(() => { document.getElementById("status").innerText = ""; }, 3000);
        }
    </script>

</body>
</html>
